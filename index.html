<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
         body {
        background: #5398bacc;
        font-family: Arial;
      }
        #box{ 
             width: 400px;
        margin: 40px auto;
        background: lightgoldenrodyellow;
        padding: 20px;
        border-radius: 10px;
            
        }
         h1 {
        text-align: center ;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
      }
      input {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        margin: 5px; 
        padding: 5px;
      }
      button {
        width: 100%;
        padding: 10px; 
        background-color: lightgreen ; 
        color: black;
      }

    </style>
</head>
<body>   

    <br><br><br><br><br>
    <div  id="box" > 
        <h1>Login page</h1>            
    Username <input id="username" type="text"><br>
    Password <input id="password" type="text"><br>
    <button onclick="signUp()">Sign Up</button><br>
    <button onclick="signIn()">Sign In</button><br>
    
    </div>
    
</body>
<script>
 
 async function signUp(){
            var usernameInput = document.getElementById("username").value 
            var passwordInput = document.getElementById("password").value 
            var userObject = {
                "username" : usernameInput,
                "password" : passwordInput
            }
            var response = await fetch("/receiveSignup",{
                "method" : "POST",
                "headers" : {
                    "Content-type" : "application/json"
                },
                "body" : JSON.stringify(userObject)
            })
           var responseText = await response.text()
            alert(responseText)
        }
async function signIn(){
            var usernameInput = document.getElementById("username").value 
            var passwordInput = document.getElementById("password").value 
            var userObject = {
                "username" : usernameInput,
                "password" : passwordInput
            }
          localStorage.setItem('username',usernameInput)  
            var response = await fetch("/receiveSignin",{
                "method" : "POST",
                "headers" : {
                    "Content-type" : "application/json"
                },
                "body" : JSON.stringify(userObject)
            })
             var responseText = await response.text()
    
             if(responseText == "Username does not exist go sign up" || responseText == "The password is wrong"){                
             alert(responseText)
            }
            else if(responseText == "Success"){
                console.log(responseText)
               window.location.href = "/Expensetracker"
            }
        }



</script>
</html>
