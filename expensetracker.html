<head>

  body {

<center>
    <div class="box">

        <h1>Expenses</h1>

  <input type="date" id="date"><br>
 <input type="text" id="title" placeholder="Reason for expense"><br>
<input type="number" id="amount" placeholder="Amount"><br>

    <button onclick="logExpenses()" >Input Expenses</button>
        <button onclick="viewExpenses()">View Expenses</button><br>
     <button onclick="Logout()">Sighn Out</button>
        <div id="expenseList">

     </div>

</center>
    
 
   <script>
           
    var today = new Date()

    var year = today.getFullYear()
    var month = today.getMonth() + 1
    var day = today.getDate()

    var todaysDate = year + "-" + month + "-" + day
 document.getElementById("date").value = todaysDate
  

  async function logExpenses(){
var titleInput = document.getElementById("title").value
        var amountInput = document.getElementById("amount").value
        var card = document.createElement("div")
 var title = document.createElement("p")
        title.textContent = titleInput
 var amount = document.createElement("p")
        amount.textContent = amountInput
        card.appendChild(title)
        card.appendChild(amount)
        document.getElementById("expenseList").appendChild(card)
 

 var date = document.getElementById("date").value
       
           
        
        


       
  var title2 = document.getElementById('title').value
 var amount2 = document.getElementById('amount').value
  var expenseObject = {
                "title": title2,
                "amount": amount2
            }
console.log(expenseObject)
       
   var jsonObject = {
         "date": date,
            "expenses": expenseObject
        }
console.log(jsonObject)
document.getElementById("title").value = ""
        document.getElementById("amount").value = ""
        await fetch("/logExpenses",{

 "method": "POST",

            "headers": {
         "Content-Type": "application/json"
            },

            "body": JSON.stringify(jsonObject)

        })

    }

    window.location.href = "/viewexpenses"

} 

function logout(){

}


</script>
